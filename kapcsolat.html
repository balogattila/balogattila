<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/BAlogo-blue.png">
    <title>Kapcsolat - Balog Attila</title>
    <style>
        /* --- ALAPVETŐ TÉMA ÉS A HÁTTÉR --- */
        body {
            background-image: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), url('images/bg.webp');
            background-color: #050505;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- FEJLÉC --- */
        .site-header {
            position: relative;
            width: 100%;
            height: 130px;
            background-color: #000000;
            margin-top: 0;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            box-sizing: border-box;
            overflow: hidden;
            border-bottom: 1px solid #1a1a1a;
        }

        .header-bg-polygons {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            background: 
                linear-gradient(105deg, transparent 20%, rgba(150, 0, 0, 0.6) 21%, rgba(200, 20, 20, 0.9) 50%, transparent 51%),
                linear-gradient(45deg, transparent 40%, rgba(100, 0, 0, 0.7) 41%, rgba(180, 10, 10, 0.95) 70%, transparent 71%),
                linear-gradient(160deg, transparent 60%, rgba(80, 0, 0, 0.8) 61%, #d00000 90%);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .custom-logo {
            height: 75px;
            width: auto;
            max-width: 100px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
            font-style: italic;
            font-weight: 700;
        }

        .title-line {
            width: 60px;
            height: 1px;
            background-color: #666666;
            margin-top: 5px;
        }

        .site-header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #dddddd;
            letter-spacing: 0.5px;
            margin: 5px 0 0 0;
        }

        /* --- TARTALMI DOBOZ --- */
        .content-container {
            width: 100%;
            max-width: 700px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 40px;
            box-sizing: border-box;
            margin: 0 20px 60px 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .page-title {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 2px solid #d00000;
            padding-bottom: 10px;
            display: inline-block;
        }

        .contact-info p {
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .contact-info ul {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .contact-info li {
            margin-bottom: 15px;
            color: #dddddd;
            font-size: 1.1rem;
        }

        .contact-info strong {
            color: #ffffff;
            display: inline-block;
            width: 120px;
        }

        .contact-info a {
            color: #d00000;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-info a:hover {
            color: #ff1a1a;
            text-decoration: underline;
        }

        /* Vissza gomb a főoldalra */
        .back-home {
            display: inline-block;
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .back-home:hover {
            color: #ffffff;
        }

        @media (max-width: 700px) {
            .site-header {
                height: auto;
                padding: 20px;
            }
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            .title-row {
                flex-direction: column;
            }
            .title-line {
                display: none;
            }
            .contact-info strong {
                display: block;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- FEJLÉC -->
    <header class="site-header">
        <div class="header-bg-polygons"></div>
        <div class="header-content">
            <a href="index.html" class="header-logo">
                <img src="images/BAlogo-blue.png" alt="Balog Attila Logo" class="custom-logo">
            </a>
            <div class="header-titles">
                <div class="title-row">
                    <h1>Balog Attila</h1>
                    <div class="title-line"></div>
                </div>
                <h2>Custom PCB & Control Systems</h2>
            </div>
        </div>
    </header>

    <!-- TARTALOM -->
    <div class="content-container">
        <h2 class="page-title">Kapcsolat</h2>
        
        <div class="contact-info">
            <p>Ha kérdésed van a projektekkel, egyedi PCB tervezéssel vagy a rendszerekkel kapcsolatban, keress bizalommal az alábbi elérhetőségeken.</p>
            <ul>
                <li><strong>Email:</strong> <a href="mailto:electronics@balogattila.hu">electronics@balogattila.hu</a></li>
                <li><strong>vagy</strong> <a href="mailto:cfop@balogattila.hu">cfop@balogattila.hu</a></li>
            </ul>
        </div>

        <a href="index.html" class="back-home">← Vissza a főoldalra</a>
    </div>

</body>
</html>
