<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balog Attila - Custom PCB & Control Systems</title>
    <style>
        /* --- ALAPVETŐ TÉMA ÉS A TE EGYEDI HÁTTERED --- */
        body {
            background-image: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), url('images/bg.webp');
            background-color: #050505;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- FEJLÉC ÉS LOGÓ BEÁLLÍTÁSOK --- */
        .site-header {
            position: relative;
            width: 100%;
            height: 130px;
            background-color: #000000;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            box-sizing: border-box;
            overflow: hidden;
            border-bottom: 1px solid #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .header-bg-polygons {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            background: 
                linear-gradient(105deg, transparent 20%, rgba(150, 0, 0, 0.6) 21%, rgba(200, 20, 20, 0.9) 50%, transparent 51%),
                linear-gradient(45deg, transparent 40%, rgba(100, 0, 0, 0.7) 41%, rgba(180, 10, 10, 0.95) 70%, transparent 71%),
                linear-gradient(160deg, transparent 60%, rgba(80, 0, 0, 0.8) 61%, #d00000 90%);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-logo {
            height: 75px;
            width: auto;
            max-width: 100px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
            font-style: italic;
            font-weight: 700;
        }

        .title-line {
            width: 60px;
            height: 1px;
            background-color: #666666;
            margin-top: 5px;
        }

        .site-header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #dddddd;
            letter-spacing: 0.5px;
            margin: 5px 0 0 0;
        }

        /* --- RÁCS KÓD --- */
        .honeycomb-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 60px 20px;
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100%;
        }

        .honeycomb-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 850px;
            user-select: none;
        }

        .hex-break {
            flex-basis: 100%;
            height: 0;
        }

        .hex-button {
            position: relative;
            width: 240px;
            height: 277px;
            margin: 0 12px;
            background-position: center;
            background-size: cover;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
        }

        /* 1-2-3-2-1 GYÉMÁNT ELRENDEZÉS */
        .hex-button:nth-child(3),
        .hex-button:nth-child(4) {
            margin-top: -69px;
        }
        
        .hex-button:nth-child(6),
        .hex-button:nth-child(7),
        .hex-button:nth-child(8) {
            margin-top: -69px;
        }
        
        .hex-button:nth-child(10),
        .hex-button:nth-child(11) {
            margin-top: -69px;
        }
        
        .hex-button:nth-child(13) {
            margin-top: -69px;
        }

        .hex-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.35));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            transition: background 0.5s ease;
        }

        .hex-title {
            color: #f5f5f7; 
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            padding: 4px 6px;
            width: 100%;
            box-sizing: border-box;
            background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 75%);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            word-break: normal;
        }

        .hex-button:hover {
            transform: scale(1.05);
            z-index: 5;
        }

        .hex-button:hover .hex-overlay {
            background: linear-gradient(rgba(240, 98, 146, 0.25), rgba(0, 0, 0, 0.3));
        }

        .hex-button:hover .hex-title {
            color: #ffffff;
            background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 85%);
            transform: scale(1.02);
        }

        /* RESZPONZÍV MOBIL NÉZET ÉS CIKK-CAKK LOGIKA (VISSZAÁLLÍTVA) */
        @media (max-width: 700px) {
            .site-header {
                height: auto;
                padding: 20px;
            }
            .header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
            }
            .title-row {
                flex-direction: column;
                gap: 10px;
            }
            .title-line {
                display: none;
            }
            .site-header h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 550px) {
            .honeycomb-grid {
                max-width: 100%;
                flex-direction: column;
                align-items: flex-start !important;
                padding-left: 20px;
                padding-right: 20px;
                width: 100%;
                box-sizing: border-box;
            }
            
            .hex-break {
                display: none;
            }
            
            .hex-button {
                width: 160px;
                height: 184px;
                margin: 0 0 -46px 0 !important;
            }
            
            .hex-button:nth-child(3),
            .hex-button:nth-child(4),
            .hex-button:nth-child(6),
            .hex-button:nth-child(7),
            .hex-button:nth-child(8),
            .hex-button:nth-child(10),
            .hex-button:nth-child(11),
            .hex-button:nth-child(13) {
                margin-top: 0;
            }

            .hex-title {
                font-size: 15px; /* Picit kisebb betű mobilon, hogy elférjen a hatszögben */
                padding: 6px 2px;
            }

            .hex-button:nth-of-type(odd) {
                transform: translateX(0);
            }

            .hex-button:nth-of-type(even) {
                transform: translateX(120px);
            }
            
            .hex-button:nth-of-type(odd):hover {
                transform: translateX(0) scale(1.05);
            }
            
            .hex-button:nth-of-type(even):hover {
                transform: translateX(120px) scale(1.05);
            }
        }
    </style>
</head>
