<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldal átköltöztetés alatt - Balog Attila</title>
    <meta name="description" content="Under construction">
    <link rel="icon" type="image/png" href="images/BAlogo-blue.png">
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">
    
    <style>
        /* --- KIZÁRÓLAG AZ "UNDER CONSTRUCTION" OLDAL EGYEDI STÍLUSAI --- */
        
        .maintenance-wrapper {
            position: relative;
            overflow: hidden;
            padding: 40px 25px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .maintenance-container {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #262626;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: #f5f5f7;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* Sárga felkiáltójel ikon konténer */
        .warning-icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 25px;
            display: inline-block;
            background: rgba(234, 179, 8, 0.1);
            border: 2px solid rgba(234, 179, 8, 0.4);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.15);
        }

        /* Hozzáadott kép stílusa */
        .under-construction-img {
            max-width: 75%;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            display: inline-block;
            background-color: transparent; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); 
        }

        .page-title {
            font-family: 'Bungee Tint', cursive;
            font-size: 36px;
            line-height: 1.25;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 400;
        }

        .maintenance-desc {
            font-size: 18px;
            line-height: 1.7;
            color: #d1d5db;
            margin-bottom: 35px;
        }

        .maintenance-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .maintenance-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        }

        @media(max-width: 850px){
            .maintenance-container {
                padding: 30px 20px;
            }
            .page-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- KÖZÖS FEJLÉC -->
    <header class="site-header">
        <div class="header-bg-polygons"></div>
        <div class="header-content">
            <a href="index.html" class="header-logo">
                <img src="images/BAlogo-blue.png" alt="Balog Attila Logo" class="custom-logo">
            </a>
            <div class="header-titles">
                <div class="title-row">
                    <h1>Balog Attila</h1>
                    <div class="title-line"></div>
                </div>
                <h2>Custom PCB & Control Systems</h2>
            </div>
        </div>
    </header>

    <a href="index.html" class="back-home">← Vissza a főoldalra</a>

    <div class="maintenance-wrapper">
        <div class="maintenance-container">
            
            <!-- <div class="warning-icon">⚠️️</div> -->

            <img src="images/underconstruction.png" alt="Under construction kép" class="under-construction-img">

            <!-- <h1 class="page-title">Under construction</h1> -->

            <p class="maintenance-desc">
                Az oldal, amit keresel, jelenleg fejlesztés alatt áll. Kérjük, légy türelemmel, hamarosan elérhető lesz!
            </p>

            <a href="#" onclick="history.back(); return false;" class="maintenance-btn">← Vissza az előző oldalra</a>

        </div>
    </div>

</body>
</html>
