<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldal átköltöztetés alatt - Balog Attila</title>
    <meta name="description" content="Az oldal jelenleg átköltöztetés és fejlesztés alatt áll. Kérjük, légy türelemmel!">
    <link rel="icon" type="image/png" href="images/BAlogo-blue.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">
    <style>
        /* --- ALAPVETŐ TÉMA ÉS A HÁTTÉR --- */
        body {
            background-image: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.75)), url('images/bg.webp');
            background-color: #050505;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #f5f5f7;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* --- FEJLÉC --- */
        .site-header {
            position: relative;
            width: 100%;
            height: 130px;
            background-color: #000000;
            margin-top: 0;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            box-sizing: border-box;
            overflow: hidden;
            border-bottom: 1px solid #1a1a1a;
        }

        .header-bg-polygons {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            background: 
                linear-gradient(105deg, transparent 20%, rgba(150, 0, 0, 0.6) 21%, rgba(200, 20, 20, 0.9) 50%, transparent 51%),
                linear-gradient(45deg, transparent 40%, rgba(100, 0, 0, 0.7) 41%, rgba(180, 10, 10, 0.95) 70%, transparent 71%),
                linear-gradient(160deg, transparent 60%, rgba(80, 0, 0, 0.8) 61%, #d00000 90%);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .custom-logo {
            height: 75px;
            width: auto;
            max-width: 100px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
            font-style: italic;
            font-weight: 700;
        }

        .title-line {
            width: 60px;
            height: 1px;
            background-color: #666666;
            margin-top: 5px;
        }

        .site-header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #dddddd;
            letter-spacing: 0.5px;
            margin: 5px 0 0 0;
        }

        /* --- TARTALMI DOBOZ (ÜZENET ÉS IKON) --- */
        .maintenance-wrapper {
            position: relative;
            overflow: hidden;
            padding: 40px 25px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .maintenance-container {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #262626;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: #f5f5f7;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* Sárga felkiáltójel ikon konténer */
        .warning-icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 25px;
            display: inline-block;
            background: rgba(234, 179, 8, 0.1);
            border: 2px solid rgba(234, 179, 8, 0.4);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.15);
        }

        .page-title {
            font-family: 'Bungee Tint', cursive;
            font-size: 36px;
            line-height: 1.25;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 400;
        }

        .maintenance-desc {
            font-size: 18px;
            line-height: 1.7;
            color: #d1d5db;
            margin-bottom: 35px;
        }

        .maintenance-btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .maintenance-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        }

        .back-home {
            display: inline-block;
            margin: 20px 0 30px 25px;
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95rem;
            align-self: flex-start;
        }

        .back-home:hover {
            color: #ffffff;
        }

        @media(max-width: 850px){
            .maintenance-container {
                padding: 30px 20px;
            }
            .page-title {
                font-size: 26px;
            }
            .site-header {
                height: auto;
                padding: 20px;
            }
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            .title-row {
                flex-direction: column;
            }
            .title-line {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- FEJLÉC -->
    <header class="site-header">
        <div class="header-bg-polygons"></div>
        <div class="header-content">
            <a href="index.html" class="header-logo">
                <img src="images/BAlogo-blue.png" alt="Balog Attila Logo" class="custom-logo">
            </a>
            <div class="header-titles">
                <div class="title-row">
                    <h1>Balog Attila</h1>
                    <div class="title-line"></div>
                </div>
                <h2>Custom PCB & Control Systems</h2>
            </div>
        </div>
    </header>

    <a href="index.html" class="back-home">← Vissza a főoldalra</a>

    <div class="maintenance-wrapper">
        <div class="maintenance-container">
            
            <div class="warning-icon">⚠️</div>

            <h1 class="page-title">Átköltöztetés alatt</h1>

            <p class="maintenance-desc">
                Az oldal, amit keresel, jelenleg átköltöztetés alatt áll. Kérjük, légy türelemmel, hamarosan elérhető lesz!
            </p>

            <a href="#" onclick="history.back(); return false;" class="maintenance-btn">← Vissza az előző oldalra</a>

        </div>
    </div>

</body>
</html>
